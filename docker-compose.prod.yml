version: "3.9"

services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: terrapulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terrapulse_secret}
      POSTGRES_DB: terrapulse_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrapulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://terrapulse:${POSTGRES_PASSWORD:-terrapulse_secret}@db:5432/terrapulse_db
      - REQUIRE_DATABASE=true
      - STAC_API_URL=${STAC_API_URL:-https://earth-search.aws.element84.com/v1}
      - SENTINEL2_COLLECTION=${SENTINEL2_COLLECTION:-sentinel-2-l2a}
      - TITILER_ENDPOINT=${TITILER_ENDPOINT:-https://titiler.xyz}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
      - PHOTON_ENDPOINT=${PHOTON_ENDPOINT:-https://photon.komoot.io}
      - GEOCODER_TIMEOUT_SECONDS=${GEOCODER_TIMEOUT_SECONDS:-5}
      - GEOCODER_USER_AGENT=${GEOCODER_USER_AGENT:-TerraPulse MVP}
      - NOMINATIM_USER_AGENT=${NOMINATIM_USER_AGENT:-TerraPulse MVP}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ""
        VITE_TITILER_ENDPOINT: ${VITE_TITILER_ENDPOINT:-https://titiler.xyz}
        VITE_STAC_API_URL: ${STAC_API_URL:-https://earth-search.aws.element84.com/v1}
        VITE_SENTINEL2_COLLECTION: ${SENTINEL2_COLLECTION:-sentinel-2-l2a}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
